# Optional local executor for the host Bun server. Uses a separate development volume.
name: ${COMPOSE_PROJECT_NAME:-orgsdk-bun-dev}
services:
  executor:
    image: ${EXECUTOR_SUPERVISOR_IMAGE:-orgsdk-supervisor:dev}
    build:
      context: ../runtime
      dockerfile: Dockerfile.supervisor
    entrypoint: [bun, --watch, /executor/src/supervisor.ts]
    environment:
      DJANGO_URL: http://127.0.0.1:${PORT:-8080}
      LOCAL_EXECUTOR_BOOTSTRAP_TOKEN: ${LOCAL_EXECUTOR_BOOTSTRAP_TOKEN:-}
      EXECUTOR_IMAGE: ${EXECUTOR_JOB_IMAGE:-orgsdk-job:dev}
      EXECUTOR_SOURCE_DIR: ${EXECUTOR_SOURCE_DIR:-${PWD}/runtime/src}
      EXECUTION_NETWORK: host
      EXECUTOR_DATA_DIR: /var/lib/orgsdk
      EXECUTOR_DATA_VOLUME: ${COMPOSE_PROJECT_NAME:-orgsdk-bun-dev}-project-data
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - project-data:/var/lib/orgsdk
      - ../runtime/src:/executor/src:ro
    restart: unless-stopped
volumes:
  project-data: { name: '${COMPOSE_PROJECT_NAME:-orgsdk-bun-dev}-project-data' }
