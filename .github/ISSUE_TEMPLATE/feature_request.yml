name: Feature request
description: Propose a change for maintainer consideration.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Explain the task you are trying to complete and what prevents it today.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior you need and how you would know it works.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include any workarounds or other approaches you have tried.
