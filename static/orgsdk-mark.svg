<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="OrgSDK">
  <title>OrgSDK</title>
  <!-- Orbit-O mark, transparent. Static fallback; the node is orbited at runtime
