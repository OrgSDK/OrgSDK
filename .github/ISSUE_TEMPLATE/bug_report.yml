name: Bug report
description: Report a problem with OrgSDK.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include enough detail for a maintainer to reproduce the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The OrgSDK version or Git commit you are running.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and relevant logs
      description: Include your operating system, browser and installation method. Remove credentials and private data from logs.
