name: Checks
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: make install
      - run: make check
      - run: bunx playwright install --with-deps chromium
      - run: make build
      - run: ORGSDK_TEST_BINARY=dist/orgsdk bun test server/tests/database-history.test.ts
      - run: ORGSDK_E2E_BINARY=dist/orgsdk make e2e
      - run: scripts/smoke-binary.sh
      - run: npm run test:cli
      - run: npm run build:npm
      - run: npm pack --ignore-scripts
      - run: npm run test:distribution -- ./orgsdk-cli-0.1.0.tgz
      - run: ORGSDK_E2E_NODE_ENTRY=dist/server/index.js make e2e
      - run: npm --prefix runtime run smoke:node
      - uses: actions/upload-artifact@v4
        with:
          name: orgsdk-npm-candidate
          path: orgsdk-cli-*.tgz
          if-no-files-found: error
