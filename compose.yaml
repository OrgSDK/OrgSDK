name: ${COMPOSE_PROJECT_NAME:-orgsdk}
services:
  app:
    image: ${APP_IMAGE:-orgsdk-platform:local}
    build: .
    env_file: ${ORGSDK_ENV_FILE:-.env.deployment}
    command: [server]
    restart: unless-stopped
    networks: [execution]
    ports: ['${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:8080']
    volumes: [sqlite-data:/var/lib/orgsdk]
    environment:
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-http}
    stop_grace_period: 60s
  job-image:
    profiles: [runner]
    image: ${EXECUTOR_IMAGE:-orgsdk-job:local}
    build: runtime
    entrypoint: ["/bin/true"]
    restart: 'no'
    networks: [execution]
  executor:
    profiles: [runner]
    image: ${SUPERVISOR_IMAGE:-orgsdk-supervisor:local}
    build: {context: runtime, dockerfile: Dockerfile.supervisor}
    environment:
      DJANGO_URL: http://app:8000
      LOCAL_EXECUTOR_BOOTSTRAP_TOKEN: ${LOCAL_EXECUTOR_BOOTSTRAP_TOKEN:-}
      EXECUTOR_IMAGE: ${EXECUTOR_IMAGE:-orgsdk-job:local}
      EXECUTION_NETWORK: ${COMPOSE_PROJECT_NAME:-orgsdk}-execution
      EXECUTOR_DATA_DIR: /var/lib/orgsdk
      EXECUTOR_DATA_VOLUME: ${COMPOSE_PROJECT_NAME:-orgsdk}-project-data
    volumes: ['/var/run/docker.sock:/var/run/docker.sock', 'project-data:/var/lib/orgsdk']
    depends_on:
      app: {condition: service_healthy}
      job-image: {condition: service_completed_successfully}
    networks: [execution]
    restart: unless-stopped
networks:
  execution: {name: '${COMPOSE_PROJECT_NAME:-orgsdk}-execution'}
volumes:
  sqlite-data:
  project-data: {name: '${COMPOSE_PROJECT_NAME:-orgsdk}-project-data'}
