name: ${COMPOSE_PROJECT_NAME:-orgsdk-bun}
services:
  app:
    image: ${APP_IMAGE:-orgsdk-bun:local}
    build: .
    restart: unless-stopped
    ports: ['${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080']
    volumes: [bun-data:/var/lib/orgsdk]
    environment:
      LOCAL_EXECUTOR_BOOTSTRAP_TOKEN: ${LOCAL_EXECUTOR_BOOTSTRAP_TOKEN:-}
      ORGSDK_PUBLIC_ORIGIN: ${ORGSDK_PUBLIC_ORIGIN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      PLUGIN_CATALOG_URL: ${PLUGIN_CATALOG_URL-https://orgsdk.ai/plugins/releases.json}
      PLUGIN_MARKETPLACE_URL: ${PLUGIN_MARKETPLACE_URL-https://orgsdk.ai/plugins/catalog.json}
    stop_grace_period: 60s
  job-image:
    profiles: [runner]
    image: ${EXECUTOR_IMAGE:-orgsdk-job:local}
    build: runtime
    entrypoint: ["/bin/true"]
    restart: 'no'
  executor:
    profiles: [runner]
    image: ${SUPERVISOR_IMAGE:-orgsdk-supervisor:local}
    build: {context: runtime, dockerfile: Dockerfile.supervisor}
    environment:
      DJANGO_URL: http://app:8080
      LOCAL_EXECUTOR_BOOTSTRAP_TOKEN: ${LOCAL_EXECUTOR_BOOTSTRAP_TOKEN:-}
      EXECUTOR_IMAGE: ${EXECUTOR_IMAGE:-orgsdk-job:local}
      EXECUTION_NETWORK: ${COMPOSE_PROJECT_NAME:-orgsdk-bun}_default
      EXECUTOR_DATA_DIR: /var/lib/orgsdk
      EXECUTOR_DATA_VOLUME: ${COMPOSE_PROJECT_NAME:-orgsdk-bun}-project-data
    volumes: ['/var/run/docker.sock:/var/run/docker.sock', 'project-data:/var/lib/orgsdk']
    depends_on:
      app: {condition: service_healthy}
      job-image: {condition: service_completed_successfully}
    restart: unless-stopped
volumes:
  bun-data:
  project-data: {name: '${COMPOSE_PROJECT_NAME:-orgsdk-bun}-project-data'}
