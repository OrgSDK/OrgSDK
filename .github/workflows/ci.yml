name: Checks
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Source quality and Bun unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            runtime/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: make install
      - run: make check

  runtime:
    name: Runtime (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Node.js 22.22.0
            runtime: node
            node-version: "22.22.0"
            cli-test: node --test bin/*.test.mjs
            distribution-test: test:distribution
            upload: true
          - label: Node.js 24
            runtime: node
            node-version: "24"
            cli-test: node --test bin/*.test.mjs
            distribution-test: test:distribution
            upload: false
          - label: Bun 1.4.0
            runtime: bun
            node-version: "22.22.0"
            cli-test: bun test bin/*.test.mjs
            distribution-test: test:distribution:bun
            upload: false
    env:
      ORGSDK_TEST_RUNTIME: ${{ matrix.runtime }}
      ORGSDK_E2E_RUNTIME: ${{ matrix.runtime }}
      ORGSDK_E2E_ENTRY: dist/server/index.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            runtime/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: make install
      - name: Shared server contract in the selected runtime
        run: bun test server/tests/platform-contract.test.ts
      - name: CLI tests in the selected runtime
        run: ${{ matrix.cli-test }}
      - run: npm run build:npm
      - run: npm pack --ignore-scripts
      - name: Installed platform and runner in the selected runtime
        run: npm run ${{ matrix.distribution-test }} -- ./orgsdk-cli-0.1.0.tgz
      - name: Installed executor contract in the selected runtime
        run: npm --prefix runtime run smoke:${{ matrix.runtime }}
      - run: bunx playwright install --with-deps chromium
      - name: Browser suite with platform and workers in the selected runtime
        run: make e2e
      - uses: actions/upload-artifact@v4
        if: matrix.upload
        with:
          name: orgsdk-npm-candidate
          path: orgsdk-cli-*.tgz
          if-no-files-found: error

  standalone:
    name: Bun standalone executable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            runtime/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: make install
      - run: bunx playwright install --with-deps chromium
      - run: make build
      - run: ORGSDK_TEST_BINARY=dist/orgsdk bun test server/tests/database-history.test.ts
      - run: ORGSDK_E2E_BINARY=dist/orgsdk make e2e
      - run: scripts/smoke-binary.sh

  check:
    if: always()
    needs: [source, runtime, standalone]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality and runtime job to pass
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          STANDALONE_RESULT: ${{ needs.standalone.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$RUNTIME_RESULT" = success
          test "$STANDALONE_RESULT" = success
