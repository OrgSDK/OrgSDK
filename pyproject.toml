[project]
name = "orgsdk-platform"
version = "0.1.0"
description = "Local-first multi-agent workflows with registered external executors"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "croniter>=6,<7",
    "cryptography>=50,<51",
    "django>=6.1.2,<6.2",
    "django-allauth[mfa,socialaccount]>=65.20.0",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "drf-spectacular-sidecar>=2026.10.1",
    "httpx>=0.28,<1",
    "jsonschema>=4,<5",
    "procrastinate[django]>=3.8,<4",
    "psycopg[binary]>=3.3.6",
    "uvicorn>=0.34,<1",
    "whitenoise[brotli]>=6.12.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=8.0.0",
    "django-extensions>=4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false
required-version = ">=0.13.1"
prerelease = "disallow"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
